<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 반 알림</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Noto Sans KR", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #fff5e6 0%, #ffe8f1 50%, #e8f4ff 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 25px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #ff8c42 0%, #ff6b9d 50%, #c44569 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '📢';
      position: absolute;
      font-size: 100px;
      opacity: 0.1;
      top: -20px;
      right: -20px;
    }

    .header h1 {
      font-size: 36px;
      margin-bottom: 8px;
      font-weight: 700;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .header p {
      font-size: 16px;
      opacity: 0.95;
      font-weight: 500;
    }

    .tabs {
      display: flex;
      border-bottom: 3px solid #fff0e6;
      background: #fafafa;
      padding: 0 20px;
    }

    .tab-button {
      flex: 1;
      padding: 18px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      color: #999;
      transition: all 0.3s;
      border-bottom: 4px solid transparent;
    }

    .tab-button.active {
      color: #ff6b9d;
      border-bottom-color: #ff6b9d;
      background: white;
    }

    .content {
      padding: 40px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: #333;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.3s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #ff6b9d;
      box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.1);
      background: #fff9fc;
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    .button {
      background: linear-gradient(135deg, #ff6b9d 0%, #ff8c42 100%);
      color: white;
      padding: 14px 40px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(255, 107, 157, 0.3);
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 107, 157, 0.4);
    }

    .button:active {
      transform: translateY(0);
    }

    .message {
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 15px;
      font-weight: 500;
      border-left: 4px solid;
    }

    .message.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left-color: #4caf50;
    }

    .message.error {
      background: #ffebee;
      color: #c62828;
      border-left-color: #f44336;
    }

    .notification-card {
      background: linear-gradient(135deg, #fff9e6 0%, #fff0f5 100%);
      border: 2px solid #ffe0b2;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 18px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .notification-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: linear-gradient(180deg, #ff8c42 0%, #ff6b9d 100%);
    }

    .notification-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(255, 107, 157, 0.2);
    }

    .notification-date {
      color: #ff8c42;
      font-size: 13px;
      margin-bottom: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .notification-title {
      color: #333;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .notification-content {
      color: #555;
      font-size: 15px;
      line-height: 1.7;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #bbb;
    }

    .empty-state p {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .empty-state-icon {
      font-size: 60px;
      margin-bottom: 15px;
      opacity: 0.5;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #ff6b9d;
      font-size: 16px;
      font-weight: 500;
    }

    .loading::after {
      content: '...';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎉 우리 반 알림</h1>
      <p>최신 소식을 확인하세요</p>
    </div>

    <div class="tabs">
      <button class="tab-button active" onclick="switchTab('view')">📋 조회</button>
      <button class="tab-button" onclick="switchTab('register')">✏️ 등록</button>
    </div>

    <div class="content">
      <!-- 알림 조회 탭 -->
      <div id="view" class="tab-content active">
        <div id="notification-list" class="loading">로딩</div>
      </div>

      <!-- 알림 등록 탭 -->
      <div id="register" class="tab-content">
        <div id="register-message"></div>

        <div class="form-group">
          <label for="password">🔐 비밀번호</label>
          <input type="password" id="password" placeholder="교사용 비밀번호">
        </div>

        <div class="form-group">
          <label for="date">📅 날짜</label>
          <input type="date" id="date">
        </div>

        <div class="form-group">
          <label for="title">📌 제목</label>
          <input type="text" id="title" placeholder="알림 제목을 입력하세요" maxlength="50">
        </div>

        <div class="form-group">
          <label for="content">💬 내용</label>
          <textarea id="content" placeholder="알림 내용을 입력하세요"></textarea>
        </div>

        <button class="button" onclick="submitNotification()">✓ 등록하기</button>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });
      document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('active');
      });

      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'view') {
        loadNotifications();
      }
    }

    function loadNotifications() {
      google.script.run.withSuccessHandler(function(notifications) {
        const listDiv = document.getElementById('notification-list');

        if (notifications.length === 0) {
          listDiv.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔔</div><p>등록된 알림이 없습니다.</p></div>';
          return;
        }

        let html = '';
        notifications.forEach(notif => {
          html += `
            <div class="notification-card">
              <div class="notification-date">📅 ${escapeHtml(notif.date)}</div>
              <div class="notification-title">${escapeHtml(notif.title)}</div>
              <div class="notification-content">${escapeHtml(notif.content).replace(/\n/g, '<br>')}</div>
            </div>
          `;
        });

        listDiv.innerHTML = html;
      }).getNotifications();
    }

    function submitNotification() {
      const password = document.getElementById('password').value;
      const date = document.getElementById('date').value;
      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;
      const messageDiv = document.getElementById('register-message');

      if (!password || !date || !title || !content) {
        messageDiv.innerHTML = '<div class="message error">⚠️ 모든 필드를 입력해주세요.</div>';
        return;
      }

      google.script.run.withSuccessHandler(function(result) {
        if (result.success) {
          messageDiv.innerHTML = '<div class="message success">✓ ' + result.message + '</div>';
          document.getElementById('password').value = '';
          document.getElementById('date').value = '';
          document.getElementById('title').value = '';
          document.getElementById('content').value = '';
        } else {
          messageDiv.innerHTML = '<div class="message error">✕ ' + result.message + '</div>';
        }
      }).addNotification(password, date, title, content);
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    window.addEventListener('load', loadNotifications);
  </script>
</body>
</html>
